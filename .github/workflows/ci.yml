name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  coding-standards:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer install --no-progress --no-interaction
      - run: composer lint

  php-lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin folder (same files as on WordPress.org)
        run: |
          mkdir -p "build/${{ github.event.repository.name }}"
          rsync -a --exclude-from=.distignore ./ "build/${{ github.event.repository.name }}/"
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/${{ github.event.repository.name }}
          slug: ${{ github.event.repository.name }}
          ignore-codes: trademarked_term
