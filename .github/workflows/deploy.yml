name: Deploy to WordPress.org

# Runs when a GitHub release is published. The release tag (e.g. 2.0.1) must match
# "Version" in login-security-for-wp.php and "Stable tag" in readme.txt.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the plugin version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -qE "^ \* Version:\s+$TAG\s*$" login-security-for-wp.php || { echo "::error::Version in login-security-for-wp.php is not $TAG"; exit 1; }
          grep -qE "^Stable tag:\s+$TAG\s*$" readme.txt || { echo "::error::Stable tag in readme.txt is not $TAG"; exit 1; }

      - name: Deploy to WordPress.org SVN
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}

      - name: Attach ZIP to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.deploy.outputs.zip-path }}" --clobber
